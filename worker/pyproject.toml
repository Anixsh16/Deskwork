[project]
name = "deskwork-worker"
version = "0.1.0"
description = "Deskwork background processing worker for exam extraction, rubric generation, and grading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "pydantic>=2.7.0",
    "openpyxl>=3.1.2",
    "psycopg[binary]>=3.1.18",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
